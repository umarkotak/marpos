<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marpos</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f7f8;
      color: #223a36;
      font:
        16px system-ui,
        sans-serif;
    }
    main {
      max-width: 28rem;
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
    }
    p {
      line-height: 1.5;
    }
    button {
      border: 0;
      border-radius: 0.5rem;
      background: #0d8061;
      color: #fff;
      padding: 0.8rem 1rem;
      font: inherit;
      cursor: pointer;
    }
    select {
      position: fixed;
      top: 1rem;
      right: 1rem;
      padding: 0.5rem;
      font: inherit;
    }
  </style>
  <select id="language">
    <option value="en" lang="en">English</option>
    <option value="id" lang="id">Bahasa Indonesia</option>
  </select>
  <main>
    <h1 id="title"></h1>
    <p id="help"></p>
    <button id="retry" onclick="location.reload()"></button>
  </main>
  <script>
    (async () => {
      const [en, id] = await Promise.all(
        ["en", "id"].map((locale) =>
          fetch(`/locales/${locale}.json`).then((response) => response.json()),
        ),
      );
      const language = document.getElementById("language");
      try {
        language.value =
          localStorage.getItem("marpos-language") === "id" ? "id" : "en";
      } catch {}
      function render() {
        const text = language.value === "id" ? id : en;
        document.documentElement.lang = language.value;
        document.title = text.offline_title;
        language.setAttribute("aria-label", text.choose_language);
        document.getElementById("title").textContent = text.offline_title;
        document.getElementById("help").textContent = text.offline_help;
        document.getElementById("retry").textContent = text.try_again;
      }
      language.onchange = () => {
        try {
          localStorage.setItem("marpos-language", language.value);
        } catch {}
        render();
      };
      render();
    })();
  </script>
</html>
